name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          Z="$(git log -1 --name-only --pretty=format: -- '*.zip' | grep -m1 zip)"
          echo "Using: $Z"
          rm -rf LampacTV
          unzip -q "$Z"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: LampacTV
      - uses: actions/upload-artifact@v4
        with:
          name: LampacTV-debug-apk
          path: LampacTV/app/build/outputs/apk/debug/*.apk
